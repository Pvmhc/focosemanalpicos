<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Comercial Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #008200; --primary-dark: #005f00; --accent: #0b0c10; --bg: #f4f7f5; --card: #ffffff;
            --text: #0b0c10; --muted: #657786; --border: #e1e8ed; --heineken-red: #ff2b2b;
            /* Paleta de estados consolidada: azul (pendente/foco), verde (concluído), âmbar (negociado), vermelho (não ok), cinza (vazio) */
            --foco-color: #2563eb; --foco-bg: #eff6ff;
            --nok-color: var(--heineken-red); --nok-bg: #fff5f5;
            --ok-color: #008200; --ok-bg: #e6f6e6;
            --vazio-color: #94a3b8; --vazio-bg: #f5f8fa;
            --negociado-color: #b45309; --negociado-bg: #fef3e2;
            --focosemanal-color: #2563eb; --focosemanal-bg: #eff6ff;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; }
        @media (min-width: 768px) { body { padding: 24px; } }
        .container { max-width: 1400px; margin: 0 auto; }

        header {
            margin-bottom: 16px; padding: 18px 22px; display: flex; flex-direction: column; gap: 18px;
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            box-shadow: 0 1px 3px rgba(11,12,16,.05), 0 8px 20px -14px rgba(11,12,16,.12);
        }
        @media (min-width: 768px) {
            header { flex-direction: row; align-items: center; justify-content: space-between; padding: 20px 28px; }
            header .resumo-foco { padding-left: 24px; border-left: 1px solid var(--border); }
        }

        .actions-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 10px 12px; margin-bottom: 16px;
            box-shadow: 0 1px 3px rgba(11,12,16,.05), 0 8px 20px -14px rgba(11,12,16,.12);
        }
        @media (min-width: 768px) {
            .actions-card { padding: 16px 20px; }
        }

        .resumo-foco .resumo-card { padding: 0; }
        .resumo-titulo { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; }
        .resumo-titulo span { color: var(--text); text-transform: none; letter-spacing: 0; }
        .resumo-grid {
            display: flex; gap: 14px; flex-wrap: nowrap;
            overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch;
        }
        .resumo-col { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 46px; flex: 0 0 auto; }
        .resumo-marca { font-size: 0.62rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
        .resumo-pill { font-size: 0.82rem; font-weight: 700; border-radius: 8px; padding: 4px 0; width: 100%; text-align: center; line-height: 1.2; }
        .resumo-pill.foco { background: var(--foco-bg); color: var(--foco-color); }
        .resumo-pill.atingido { background: var(--ok-bg); color: var(--ok-color); }
        .resumo-legenda { display: flex; gap: 16px; margin-top: 10px; font-size: 0.68rem; color: var(--muted); }
        .resumo-legenda .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
        .resumo-legenda .dot.foco { background: var(--foco-color); }
        .resumo-legenda .dot.atingido { background: var(--ok-color); }
        header h1 {
            margin: 0; color: var(--muted); font-size: 1.05rem; font-weight: 700;
            display: flex; align-items: center; gap: 8px; letter-spacing: -.01em; text-transform: uppercase;
        }
        header h1 .star-icon { width: 18px; height: 18px; flex: 0 0 auto; opacity: .7; }
        .resumo-foco { flex: 1; }
        @media (min-width: 768px) { header { flex-direction: row-reverse; } header .resumo-foco { padding-left: 0; padding-right: 24px; border-left: none; border-right: 1px solid var(--border); } }
        
        .actions-bar { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; justify-content: flex-start; align-items: center; }
        .actions-divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; display: none; }
        @media (min-width: 768px) { .actions-divider { display: block; } }
        
        .btn-action {
            padding: 6px 10px; 
            font-size: 0.78rem; 
            font-weight: 700; 
            border-radius: 8px;
            cursor: pointer; 
            border: none;
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 5px;
            color: white;
            box-shadow: 0 2px 4px rgba(11,12,16,.1);
            transition: transform .15s ease, filter .15s ease;
        }
        .btn-action:hover { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 4px 8px rgba(11,12,16,.15); }
        .btn-action:active { transform: translateY(0); filter: brightness(0.95); box-shadow: 0 1px 2px rgba(11,12,16,.1); }
        .btn-action svg { width: 14px; height: 14px; }
        @media (min-width: 768px) {
            .actions-bar { gap: 12px; }
            .btn-action { padding: 10px 18px; font-size: 1rem; gap: 8px; }
            .btn-action svg { width: 18px; height: 18px; }
        }
        
        .btn-sync { background-color: #008200; }
        .btn-pdf { background-color: #0b0c10; }
        .btn-excel { background-color: #1e7b46; }
        .btn-limpar {
            background-color: transparent; color: #dc2626; border: 1.5px solid #fecaca; box-shadow: none;
        }
        .btn-limpar:hover { background-color: #dc2626; color: #fff; filter: none; }
        .btn-focosemanal { background-color: #2563eb; }

        .modal-foco-overlay {
            display: none; position: fixed; inset: 0; background: rgba(11,12,16,.55);
            align-items: center; justify-content: center; z-index: 1000; padding: 16px;
        }
        .modal-foco-overlay.aberto { display: flex; }
        .modal-foco-box {
            background: var(--card); border-radius: 14px; width: 100%; max-width: 420px;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px -20px rgba(11,12,16,.4);
        }
        .modal-foco-header {
            padding: 18px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-foco-header h2 { margin: 0; font-size: 1.05rem; color: var(--text); }
        .modal-foco-close { background: none; border: none; font-size: 1.3rem; color: var(--muted); cursor: pointer; line-height: 1; }
        .modal-foco-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .modal-foco-linha label { display: block; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; }
        .modal-foco-linha select {
            width: 100%; padding: 11px 12px; font-size: 0.92rem; border: 1px solid var(--border);
            border-radius: 10px; font-weight: 600; background-color: #fff; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 14px center; background-size: 16px;
        }
        .modal-foco-footer { padding: 16px 20px; background: var(--bg); border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; border-radius: 0 0 14px 14px; }

        /* Modal de código de acesso (PIN) para Excel / Marca Foco */
        .modal-pin-body { padding: 22px 20px 6px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .modal-pin-body p { margin: 0 0 4px; color: var(--muted); font-size: 0.88rem; text-align: center; }
        .modal-pin-input {
            width: 140px; text-align: center; letter-spacing: 8px; font-size: 1.4rem; font-weight: 700;
            padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; color: var(--text);
        }
        .modal-pin-input.erro { border-color: #dc2626; animation: abanarPin 0.3s; }
        @keyframes abanarPin { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .modal-pin-erro-msg { color: #dc2626; font-size: 0.8rem; font-weight: 700; min-height: 18px; }

        .filters-grid { display: grid; grid-template-columns: 1fr; gap: 16px; background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
        @media (min-width: 600px) { .filters-grid { grid-template-columns: 2fr 1fr 1fr; padding: 24px; } }
        .filter-control label { display: block; font-size: 0.75rem; color: var(--primary); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; }
        .filter-control select { width: 100%; padding: 12px; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 10px; font-weight: 600; background-color: #fff; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23008200' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; }
        .days-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 6px; }
        .tab-btn { flex: 1; min-width: 90px; padding: 12px 10px; background: #ffffff; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.85rem; color: var(--muted); text-align: center; }
        .tab-btn.active { background: var(--accent); color: white; }

        .search-row { position: relative; margin-bottom: 14px; }
        .search-row input {
            width: 100%; padding: 12px 16px 12px 42px; font-size: 0.92rem; font-weight: 500;
            border: 1px solid var(--border); border-radius: 12px; background: var(--card);
            color: var(--text); box-sizing: border-box;
        }
        .search-row input:focus { outline: none; border-color: var(--accent); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; fill: var(--muted); pointer-events: none; }
        .cliente-meta { display: block; font-size: 0.7rem; font-weight: 600; color: var(--muted); margin-top: 2px; }
        .table-container { background: transparent; }
        table { width: 100%; border-collapse: collapse; }
        thead { display: none; }
        tbody tr { display: block; background: var(--card); margin-bottom: 16px; padding: 16px; border-radius: 14px; border: 1px solid var(--border); }
        tbody td { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 0.95rem; }
        tbody td:last-child { border-bottom: none; }
        tbody td:first-child { display: block; font-weight: 800; font-size: 1.1rem; color: var(--accent); border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-bottom: 8px; }
        tbody td:not(:first-child)::before { content: attr(data-label); font-weight: 700; color: var(--muted); font-size: 0.85rem; }
        .cell-container { display: flex; align-items: center; gap: 12px; width: 65%; justify-content: flex-end; }
        .icons-row { display: flex; gap: 8px; align-items: center; }
        .icon-disabled { opacity: 0.12; filter: grayscale(100%); }
        .texto-elegibilidade { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
        .texto-elegibilidade.elegivel { background: var(--vazio-bg); color: var(--muted); }
        .texto-elegibilidade.implementado { background: var(--ok-bg); color: var(--ok-color); }
        
        .btn-estado { padding: 6px 10px; border-radius: 20px; font-size: 0.76rem; font-weight: 700; cursor: pointer; width: 132px; height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; white-space: nowrap; }
        .btn-estado.vazio { background-color: var(--vazio-bg); color: var(--vazio-color); border-color: var(--border); }
        .btn-estado.foco { background-color: var(--foco-bg); color: var(--foco-color); border-color: #bfdbfe; }
        .btn-estado.focosemanal { background-color: var(--focosemanal-bg); color: var(--focosemanal-color); border-color: #bfdbfe; }
        .btn-estado.nao-ok { background-color: var(--nok-bg); color: var(--nok-color); border-color: #fecaca; }
        .btn-estado.ok { background-color: var(--ok-bg); color: var(--ok-color); border-color: #a7f3d0; }
        .btn-estado.negociado { background-color: var(--negociado-bg); color: var(--negociado-color); border-color: #fde3b0; }

        .badge-colocou { font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; white-space: nowrap; text-align: center; }
        .badge-colocou.sim { background-color: var(--ok-bg); color: var(--ok-color); }
        .badge-colocou.nao { background-color: var(--vazio-bg); color: var(--vazio-color); }
        .svg-icon { width: 16px; height: 16px; fill: currentColor; }
        @media (max-width: 599px) { .svg-icon { width: 13px; height: 13px; } }
        /* Cortina de carregamento a ecrã inteiro */
        .loading-notice {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(30, 26, 10, 0.88);
            backdrop-filter: blur(2px);
            color: #fff3cd;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            z-index: 10000;
            padding: 20px;
        }
        .loading-notice.show { display: flex; }

        .beer-loader { position: relative; width: 90px; height: 114px; flex-shrink: 0; }
        .beer-loader svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; }
        .beer-loader .copo-contorno { fill: none; stroke: #fff3cd; stroke-width: 2; }
        .beer-loader .liquido-clip { }
        .beer-loader .liquido { fill: #f5a623; }
        .beer-loader .espuma { fill: #fffdf5; }
        .beer-loader .bolha { fill: rgba(255,255,255,0.85); }

        @keyframes encherCopo {
            0%   { transform: translateY(24px); }
            60%  { transform: translateY(4px); }
            100% { transform: translateY(4px); }
        }
        @keyframes subirBolha {
            0%   { transform: translateY(0); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translateY(-16px); opacity: 0; }
        }
        .beer-loader .liquido-grupo { animation: encherCopo 1.6s ease-out infinite alternate; }
        .beer-loader .bolha1 { animation: subirBolha 1.3s ease-in infinite; animation-delay: 0.1s; }
        .beer-loader .bolha2 { animation: subirBolha 1.5s ease-in infinite; animation-delay: 0.5s; }
        .beer-loader .bolha3 { animation: subirBolha 1.1s ease-in infinite; animation-delay: 0.9s; }

        #impressaoSemanal { display: none; }
        @media print {
            body.imprimir-semana .container > *:not(#impressaoSemanal) { display: none !important; }
            body.imprimir-semana #impressaoSemanal { display: block !important; }
        }
        @media (min-width: 768px) {
            thead { display: table-header-group; }
            th { background-color: var(--accent); color: white; padding: 16px; font-size: 0.85rem; text-transform: uppercase; }
            tbody tr { display: table-row; background: transparent; }
            tbody td { display: table-cell; padding: 16px; border-bottom: 1px solid var(--border); text-align: center; }
            tbody td:first-child { text-align: left; }
            tbody td:not(:first-child)::before { content: none; }
            .cell-container { flex-direction: column; width: auto; justify-content: center; gap: 8px; }
        }

        /* ----- ESTILOS DO MODAL DE ENCOMENDAS ----- */
        .btn-cart { background-color: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 4px rgba(11,12,16,.1); transition: transform .15s ease, filter .15s ease; margin-top: 8px; }
        .btn-cart:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(3px); }
        .modal-container { background: var(--card); width: 95%; max-width: 700px; max-height: 85vh; border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 15px 30px rgba(0,0,0,0.3); animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { padding: 20px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; border-radius: 12px 12px 0 0; }
        .modal-header h2 { margin: 0; font-size: 1.3rem; color: var(--accent); }
        .modal-subtitle { margin: 5px 0 0 0; font-size: 0.85rem; color: var(--muted); }
        .btn-close { background: none; border: none; font-size: 1.8rem; line-height: 1; cursor: pointer; color: var(--muted); transition: color 0.2s; }
        .btn-close:hover { color: var(--accent); }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .range-section { margin-bottom: 20px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        .range-title { font-size: 1.1rem; color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .badge-negociado-modal { font-size: 0.65rem; background: var(--negociado-bg); color: var(--negociado-color); padding: 3px 6px; border-radius: 6px; }
        .product-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border); }
        .product-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .product-info { display: flex; align-items: center; gap: 10px; flex: 1; padding-right: 10px; }
        .product-thumbnail-container { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--ok-bg); border: 1px solid var(--border); flex-shrink: 0; }
        .product-svg-thumb { width: 18px; height: 18px; stroke: var(--primary); }
        .product-name { font-size: 0.9rem; font-weight: 600; color: var(--text); }

        .qty-counter { display: flex; align-items: center; gap: 5px; }
        .btn-qty { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); font-weight: bold; transition: background 0.2s;}
        .btn-qty:hover { background: #e1e8ed; }
        .input-qty { width: 45px; height: 32px; text-align: center; border: 1px solid var(--border); border-radius: 6px; font-weight: 700; font-size: 0.95rem; color: var(--text); }
        .input-qty::-webkit-outer-spin-button, .input-qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .modal-footer { padding: 20px; background: var(--bg); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 12px 12px; flex-wrap: wrap; gap: 10px; }
        .total-summary { font-size: 1rem; color: var(--text); font-weight: 600;}
        .total-summary strong { color: var(--primary); font-size: 1.2rem; }
        .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-cancel { background: #fff; color: var(--muted); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn-cancel:hover { background: var(--vazio-bg); }
        .btn-submit { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: filter 0.2s; }
        .btn-submit:hover { filter: brightness(1.1); }
        .btn-whatsapp { background: #fff; color: #1e9e56; border: 1.5px solid #1e9e56; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: background 0.2s, color 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-whatsapp:hover { background: #1e9e56; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div id="loadingBox" class="loading-notice">
        <span class="beer-loader">
            <svg viewBox="0 0 30 38">
                <defs>
                    <clipPath id="clipCopo">
                        <path d="M6 4 h18 l-1.5 28 a2 2 0 0 1 -2 2 h-11 a2 2 0 0 1 -2 -2 z" />
                    </clipPath>
                </defs>
                <g clip-path="url(#clipCopo)">
                    <g class="liquido-grupo">
                        <rect class="liquido" x="0" y="10" width="30" height="30" />
                        <rect class="espuma" x="0" y="8" width="30" height="4" />
                        <circle class="bolha bolha1" cx="11" cy="30" r="1.2" />
                        <circle class="bolha bolha2" cx="16" cy="32" r="1" />
                        <circle class="bolha bolha3" cx="20" cy="29" r="1.3" />
                    </g>
                </g>
                <path class="copo-contorno" d="M6 4 h18 l-1.5 28 a2 2 0 0 1 -2 2 h-11 a2 2 0 0 1 -2 -2 z" />
                <g transform="translate(15,20) scale(0.024) translate(-288,-274.5)">
                    <polygon fill="#ff2b2b" points="288,0 353,209 576,209 396,338 462,549 288,419 114,549 180,338 0,209 223,209" />
                </g>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBKW2SN43kQBzm-GUE9ZfYNgVcz3jPDiVPX5JaqWg6HjtPWTZv_166uL49A1lrXjQ/exec"; 

    // --- DADOS DO CATÁLOGO DE ENCOMENDAS (GAMA SAGRES ATUALIZADA) ---
    const PRODUCT_CATALOG = [
        { id: "sagres_mini_ret_20", name: "Sagres Branca Mini Retornável (Grade 24×20cl)", range: "Sagres" },
        { id: "sagres_media_ret_33", name: "Sagres Branca Média Retornável (Grade 24×33cl)", range: "Sagres" },
        { id: "sagres_mini_tp_25", name: "Sagres Branca Mini Tara Perdida (Caixa 24×25cl)", range: "Sagres" },
        { id: "sagres_media_tp_33", name: "Sagres Branca Média Tara Perdida (Tabuleiro 24×33cl)", range: "Sagres" },
        { id: "heineken_ret_24_25", name: "Heineken Retornável 24×25cl", range: "Heineken" },
        { id: "heineken_tara_perdida_24_25", name: "Heineken Tara Perdida 24×25cl", range: "Heineken" },
        { id: "heineken_tara_perdida_24_33", name: "Heineken Tara Perdida 24×33cl", range: "Heineken" },
        { id: "bandida_maca_ret_24_33", name: "Bandida Maçã Retornável 24×33cl", range: "Bandida" },
        { id: "bandida_frutos_vermelhos_24_33", name: "Bandida Frutos Vermelhos 24×33cl", range: "Bandida" },
        { id: "bandida_maca_24_33", name: "Bandida Maçã 24×33cl", range: "Bandida" },
        { id: "sagres_00_4p", name: "Sagres Média 0.0% 4Packs 6×33cl", range: "0.0%" },
        { id: "sagres_00_ret", name: "Sagres 0.0% Retornável 24×33cl", range: "0.0%" },
        { id: "heineken_00_4p", name: "Heineken 0.0% 4Packs 6×25cl", range: "0.0%" },
        { id: "sagres_preta_mini_ret", name: "Sagres Preta Mini Ret. 24×20cl", range: "PRETA" },
        { id: "sagres_preta_med_ret", name: "Sagres Preta Média Ret. 24×33cl", range: "PRETA" },
        { id: "guinness_6p", name: "Guinness 6Packs (4×44cl)", range: "PRETA" },
        { id: "sagres_sol_mar_24", name: "Sagres Sol & Mar 24×33cl", range: "Sol & Mar" },
        { id: "luso_ret_24", name: "Luso Retornável 24×25cl", range: "Luso Retornável" }
    ];

    let clienteAtualEncomenda = null;
    let quantidadesEncomenda = {};

    let marcasLista = ["0.0%", "Bandida", "Heineken", "PRETA"];
    const ordemMarcasFixa = ["Sagres", "Heineken", "Bandida", "0.0%", "PRETA"];
    // Ordem real das colunas de marca, tal como aparece no cabeçalho do último
    // Excel importado. Persistida no servidor (config 'ordemMarcas') para que
    // todos os GC vejam sempre a mesma ordem — em vez de recalculada a cada
    // sincronização por ordem alfabética.
    let ORDEM_MARCAS_SERVIDOR = [];

    const MARCA_FOCO_POR_SEMANA_DEFAULT = {
        "1": "0.0%",
        "2": "bandida",
        "3": "preta",
        "4": "heineken"
    };
    let MARCA_FOCO_POR_SEMANA = { ...MARCA_FOCO_POR_SEMANA_DEFAULT };
    (function carregarFocoSemanalGuardado() {
        try {
            const guardado = localStorage.getItem('marcaFocoPorSemana');
            if (guardado) {
                const obj = JSON.parse(guardado);
                MARCA_FOCO_POR_SEMANA = { ...MARCA_FOCO_POR_SEMANA_DEFAULT, ...obj };
            }
        } catch (e) { console.error('Erro ao carregar marca foco guardada:', e); }
    })();

    function abrirModalFocoSemanal() {
        const corpo = document.getElementById('modalFocoBody');
        const opcoesMarcas = (marcasLista && marcasLista.length > 0) ? marcasLista : ordemMarcasFixa;
        const semanas = ['1', '2', '3', '4'];
        corpo.innerHTML = semanas.map(sem => {
            const valorAtual = (MARCA_FOCO_POR_SEMANA[sem] || '').trim().toLowerCase();
            const opcoesHtml = opcoesMarcas.map(m => {
                const selecionado = m.trim().toLowerCase() === valorAtual ? 'selected' : '';
                return `<option value="${m}" ${selecionado}>${m}</option>`;
            }).join('');
            return `
                <div class="modal-foco-linha">
                    <label>Semana ${sem}</label>
                    <select id="focoSemana_${sem}">
                        <option value="">— Sem marca foco —</option>
                        ${opcoesHtml}
                    </select>
                </div>`;
        }).join('');
        document.getElementById('modalFocoOverlay').classList.add('aberto');
    }

    function fecharModalFocoSemanal() {
        document.getElementById('modalFocoOverlay').classList.remove('aberto');
    }

    let focoSemanalASalvar = false;

    async function guardarFocoSemanal() {
        const semanas = ['1', '2', '3', '4'];
        const novoMapa = {};
        semanas.forEach(sem => {
            const select = document.getElementById('focoSemana_' + sem);
            if (select) novoMapa[sem] = select.value;
        });
        MARCA_FOCO_POR_SEMANA = novoMapa;
        localStorage.setItem('marcaFocoPorSemana', JSON.stringify(novoMapa));
        limparFocoSemanalDesatualizadoLocal_(novoMapa);
        fecharModalFocoSemanal();
        atualizarVisualizacao();

        // Enquanto a gravação estiver em curso, o polling automático não pode
        // sobrescrever MARCA_FOCO_POR_SEMANA com dados antigos do servidor
        // (evita que a marca foco recém-escolhida "volte atrás" por corrida
        // entre este pedido e o próximo puxarDadosDaNuvem em segundo plano).
        focoSemanalASalvar = true;
        try {
            // UM ÚNICO pedido (em vez de 5 em simultâneo: guardar_config + 4x
            // limpar_foco_semanal), que sobrecarregava o lock do Apps Script e
            // fazia falhar a sincronização deste botão especificamente.
            // O backend já tinha a ação atómica pronta — só faltava usá-la aqui.
            const resultado = await postComRetry_({ action: 'guardar_foco_semanal_completo', marcaFocoPorSemana: novoMapa });
            if (!resultado || resultado.ok === false) {
                // DEBUG TEMPORÁRIO — mostra o erro real no ecrã. Remover depois de resolvido.
                alert('DEBUG — falha ao guardar Marca Foco:\n' + JSON.stringify(resultado));
                mostrarAvisoSync_();
            }
        } finally {
            focoSemanalASalvar = false;
        }
    }

    // Feedback visual imediato (local); a gravação/aplicação real acontece no
    // servidor dentro de guardar_foco_semanal_completo, num único POST.
    // Espelha exatamente a lógica do backend: limpa FOCOSEMANAL desatualizado
    // e aplica-o à nova marca foco, exceto onde já há um estado final.
    const ESTADOS_FINAIS_FOCO_ = new Set(['OK', 'NAO OK', 'NEGOCIADO']);
    function limparFocoSemanalDesatualizadoLocal_(mapaNovo) {
        const semanas = ['1', '2', '3', '4'];
        semanas.forEach(sem => {
            const marcaFocoOriginal = (mapaNovo[sem] || '').trim();
            const marcaFocoNorm = marcaFocoOriginal.toLowerCase();
            baseDadosRotas.forEach(item => {
                if (item.semana !== sem || !item.estados) return;

                // a) limpa FOCOSEMANAL de marcas que já não são a foco
                Object.keys(item.estados).forEach(marca => {
                    if (item.estados[marca] === 'FOCOSEMANAL' && marca.trim().toLowerCase() !== marcaFocoNorm) {
                        item.estados[marca] = '';
                    }
                });

                // b) aplica FOCOSEMANAL à marca foco escolhida, exceto se já
                //    houver um estado final (OK / NÃO OK / NEGOCIADO)
                if (marcaFocoOriginal) {
                    const chaveExistente = Object.keys(item.estados).find(m => m.trim().toLowerCase() === marcaFocoNorm);
                    const chave = chaveExistente || marcaFocoOriginal;
                    const atual = item.estados[chave] || '';
                    if (!ESTADOS_FINAIS_FOCO_.has(atual)) {
                        item.estados[chave] = 'FOCOSEMANAL';
                    }
                }
            });
        });
    }

    // Atualiza localmente (para feedback imediato no ecrã) e pede ao servidor,
    // NUM ÚNICO PEDIDO por semana, para limpar em lote a marca "FOCO SEMANAL"
    // de qualquer marca que já não seja a marca foco definida — em vez de
    // disparar um pedido por cada registo alterado (o que sobrecarregava o
    // servidor quando há muitos utilizadores em simultâneo).
    //
    // IMPORTANTE: o pedido ao servidor é SEMPRE enviado, mesmo que os dados
    // carregados neste browser (baseDadosRotas) não mostrem nenhuma marca
    // desatualizada. Isto porque o browser de quem grava a "Marca Foco" pode
    // não ter a versão mais recente de todos os registos (de outros dias e
    // GCs) — se só enviássemos o pedido quando detectássemos uma alteração
    // localmente, marcas FOCO SEMANAL desatualizadas noutros GCs nunca eram
    // limpas no servidor e continuavam a aparecer.
    const CABECALHOS_RESERVADOS = new Set([
        'cliente', 'pdv', 'estabelecimento', 'comercial', 'gestor', 'vendedor',
        'nome vendedor', 'nome do vendedor', 'tipologia',
        'segmento de clientes', 'frequência de visitas', 'frequencia de visitas',
        'dia', 'dia da semana', 'dia semana', 'semana', 'semana do mês', 'id',
        'numero', 'número', 'nº', 'n.º', 'nº estabelecimento', 'numero estabelecimento',
        'número do estabelecimento', 'codigo', 'código',
        'estados', 'estadosjson', 'historico', 'historicojson',
        'semana 1', 'semana 2', 'semana 3', 'semana 4', 'semana 5', 'semana 6'
    ]);

    // Nomes normalizados das colunas "0.0%" e "Preta" — usados para decidir,
    // por cliente/linha, qual das duas aparece (ver ehColunaZeroZero_ / ehColunaPreta_).
    function ehColunaZeroZero_(m) { return String(m || '').trim().toLowerCase() === '0.0%'; }
    function ehColunaPreta_(m) {
        const n = String(m || '').trim().toLowerCase();
        return n === 'preta' || n === 'sagres preta';
    }

    /**
     * Conta clientes ÚNICOS por gestor/comercial numa lista de registos vinda do
     * import Excel. Um mesmo cliente pode aparecer várias vezes (dias/semanas
     * diferentes) — conta-se só 1 vez por gestor. A identidade do cliente usa o
     * "número" do estabelecimento quando existe (mais fiável), caindo para o
     * nome (normalizado) quando não há número.
     */
    function contarClientesUnicosPorGestor_(linhas) {
        const porGestor = {}; // comercial -> Set de chaves únicas
        linhas.forEach(r => {
            const numero = (r.numero !== undefined && r.numero !== null) ? String(r.numero).trim() : '';
            const chave = numero !== '' ? 'num:' + numero.toLowerCase() : 'nome:' + String(r.cliente || '').trim().toLowerCase();
            const gestor = String(r.comercial || 'Sem Gestor').trim();
            if (!porGestor[gestor]) porGestor[gestor] = new Set();
            porGestor[gestor].add(chave);
        });
        const linhasResumo = Object.keys(porGestor)
            .map(gestor => ({ gestor, total: porGestor[gestor].size }))
            .sort((a, b) => b.total - a.total || a.gestor.localeCompare(b.gestor));
        const totalGeral = new Set(linhas.map(r => {
            const numero = (r.numero !== undefined && r.numero !== null) ? String(r.numero).trim() : '';
            return numero !== '' ? 'num:' + numero.toLowerCase() : 'nome:' + String(r.cliente || '').trim().toLowerCase();
        })).size;
        return { linhasResumo, totalGeral };
    }

    function mostrarResumoClientesPorGestor_(linhas) {
        const { linhasResumo, totalGeral } = contarClientesUnicosPorGestor_(linhas);
        const corpo = document.getElementById('modalResumoClientesBody');
        if (!corpo) return;
        const linhasHtml = linhasResumo.map(l =>
            `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;">
                <span>${l.gestor}</span>
                <strong>${l.total}</strong>
            </div>`
        ).join('');
        corpo.innerHTML = `
            <div style="display:flex;justify-content:space-between;padding:8px 0 12px 0;font-weight:700;font-size:1.05rem;">
                <span>Total geral (clientes únicos)</span>
                <span>${totalGeral}</span>
            </div>
            ${linhasHtml || '<p>Sem dados de gestores.</p>'}
        `;
        document.getElementById('modalResumoClientesOverlay').style.display = 'flex';
    }

    /**
     * Calcula, para cada marca, a % de clientes ÚNICOS (sem duplicados por
     * dia/semana) que já a colocaram este ano (historico.ano). Serve apenas
     * de referência visual no cabeçalho — não interfere com FOCO/OK/etc.
     */
    function calcularCoberturaPorMarca_() {
        const clientesUnicos = {}; // chave única do cliente -> { marca: true/false }
        baseDadosRotas.forEach(r => {
            const numero = (r.numero !== undefined && r.numero !== null) ? String(r.numero).trim() : '';
            const chave = numero !== '' ? 'num:' + numero.toLowerCase() : 'nome:' + String(r.cliente || '').trim().toLowerCase();
            if (!clientesUnicos[chave]) clientesUnicos[chave] = {};
            marcasLista.forEach(m => {
                const hist = (r.historico && r.historico[m]) || {};
                if (hist.ano) clientesUnicos[chave][m] = true;
            });
        });
        const totalClientes = Object.keys(clientesUnicos).length;
        const cobertura = {};
        marcasLista.forEach(m => {
            if (totalClientes === 0) { cobertura[m] = null; return; }
            let comMarca = 0;
            Object.values(clientesUnicos).forEach(obj => { if (obj[m]) comMarca++; });
            cobertura[m] = Math.round((comMarca / totalClientes) * 100);
        });
        return cobertura;
    }

    function renderCabecalhoTabela() {
        const linha = document.getElementById('cabecalhoTabela');
        if (!linha) return;
        const cobertura = calcularCoberturaPorMarca_();
        linha.innerHTML = `<th>Estabelecimento</th>` + marcasLista.map(m => {
            const pct = cobertura[m];
            const pctHtml = (pct === null || pct === undefined)
                ? ''
                : `<div style="font-weight:400;font-size:0.68rem;opacity:0.8;">${pct}% Cobertura Anual</div>`;
            return `<th>${m}${pctHtml}</th>`;
        }).join('');
    }

    function sincronizarMarcasVariaveis() {
        const setMarcas = new Set();
        baseDadosRotas.forEach(r => {
            if (r.estados) Object.keys(r.estados).forEach(m => setMarcas.add(m));
            if (r.historico) Object.keys(r.historico).forEach(m => setMarcas.add(m));
        });
        const chaves = Array.from(setMarcas);
        if (chaves.length === 0) { renderCabecalhoTabela(); return; }

        if (ORDEM_MARCAS_SERVIDOR && ORDEM_MARCAS_SERVIDOR.length > 0) {
            // Segue a ordem persistida do último Excel importado. Marcas que já não
            // aparecem em nenhum registo são omitidas; marcas que aparecem nos dados
            // mas não estão na ordem guardada (caso raro/desalinhado) vão no fim.
            const ordemNorm = ORDEM_MARCAS_SERVIDOR.map(m => m.trim().toLowerCase());
            const naOrdem = ORDEM_MARCAS_SERVIDOR.filter(m => chaves.some(c => c.trim().toLowerCase() === m.trim().toLowerCase()));
            const foraDaOrdem = chaves.filter(c => !ordemNorm.includes(c.trim().toLowerCase()));
            marcasLista = naOrdem.concat(foraDaOrdem.sort((a, b) => a.localeCompare(b)));
        } else {
            marcasLista = chaves.sort((a, b) => {
                const idxA = ordemMarcasFixa.findIndex(m => m.toLowerCase() === a.toLowerCase());
                const idxB = ordemMarcasFixa.findIndex(m => m.toLowerCase() === b.toLowerCase());
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                return a.localeCompare(b);
            });
        }
        renderCabecalhoTabela();
    }

    function obterSemanaISO(data) {
        const d = new Date(Date.UTC(data.getFullYear(), data.getMonth(), data.getDate()));
        const diaSemana = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - diaSemana);
        const inicioAno = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - inicioAno) / 86400000) + 1) / 7);
    }

    function calcularSemanaCiclo(semanaISO) {
        const offset = (((semanaISO - 30) % 4) + 4) % 4;
        return ((offset + 1) % 4) + 1;
    }

    function aplicarSemanaAtual() {
        const semanaISO = obterSemanaISO(new Date());
        const semanaCiclo = calcularSemanaCiclo(semanaISO);
        const select = document.getElementById('semanaSelect');
        Array.from(select.options).forEach(opt => {
            const rotulo = 'Semana ' + opt.value;
            opt.textContent = (opt.value === String(semanaCiclo)) ? rotulo + ' 📍 (atual)' : rotulo;
        });
        select.value = String(semanaCiclo);
    }

    // Envia um POST para o Apps Script com retry automático (com pequeno atraso)
    // quando o servidor responde "ocupado" ou há uma falha de rede transitória.
    // Isto evita perder marcações silenciosamente quando há muita gente a usar ao mesmo tempo.
    async function postComRetry_(payload, tentativas = 3) {
        for (let i = 0; i < tentativas; i++) {
            try {
                const resposta = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
                const dados = await resposta.json();
                if (dados && dados.ok === false && /ocupado/i.test(dados.erro || '') && i < tentativas - 1) {
                    await new Promise(r => setTimeout(r, 800 * (i + 1)));
                    continue;
                }
                return dados;
            } catch (e) {
                if (i === tentativas - 1) {
                    console.error('Falha ao sincronizar com a nuvem após ' + tentativas + ' tentativas:', e);
                    return { ok: false, erro: e.message };
                }
                await new Promise(r => setTimeout(r, 800 * (i + 1)));
            }
        }
    }

    // --- ALTERAÇÕES PENDENTES (proteção contra "reversão" no polling) ---
    // Guarda localmente qualquer alteração (estado FOCO/OK/etc. ou "colocou")
    // que já foi aplicada no ecrã mas cujo POST ainda não teve resposta do
    // Apps Script. O polling automático (a cada 15s) lê SEMPRE a folha
    // inteira; se a escrita anterior ainda não tiver propagado na Sheet
    // quando esse GET acontece, a resposta do servidor traz o valor antigo
    // e, sem esta proteção, esse valor antigo "pisava" a alteração recém-feita
    // no ecrã — dando a sensação de que o foco "volta ao que estava".
    const alteracoesPendentes_ = new Map();
    function marcarAlteracaoPendente_(tipo, id, marca, valor) {
        alteracoesPendentes_.set(tipo + '::' + id + '::' + marca, valor);
    }
    function limparAlteracaoPendente_(tipo, id, marca) {
        alteracoesPendentes_.delete(tipo + '::' + id + '::' + marca);
    }
    function fundirComPendentes_(novosDados) {
        if (alteracoesPendentes_.size === 0) return novosDados;
        alteracoesPendentes_.forEach((valor, chave) => {
            const [tipo, id, marca] = chave.split('::');
            const registo = novosDados.find(r => String(r.id) === id);
            if (!registo) return;
            if (tipo === 'estado') {
                if (!registo.estados) registo.estados = {};
                registo.estados[marca] = valor;
            } else if (tipo === 'colocou') {
                if (!registo.colocou) registo.colocou = {};
                registo.colocou[marca] = valor;
            }
        });
        return novosDados;
    }

    async function puxarDadosDaNuvem(silencioso) {
        if (!silencioso) mostrarLoading(true);
        try {
            let response = await fetch(GOOGLE_SCRIPT_URL + '?t=' + Date.now(), { cache: 'no-store' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const dados = await response.json();
            const novosDados = Array.isArray(dados) ? dados : (dados.registos || []);
            baseDadosRotas = fundirComPendentes_(novosDados);
            if (!Array.isArray(dados) && dados.marcaFocoPorSemana && Object.keys(dados.marcaFocoPorSemana).length > 0 && !focoSemanalASalvar) {
                MARCA_FOCO_POR_SEMANA = { ...MARCA_FOCO_POR_SEMANA_DEFAULT, ...dados.marcaFocoPorSemana };
                localStorage.setItem('marcaFocoPorSemana', JSON.stringify(MARCA_FOCO_POR_SEMANA));
            }
            if (!Array.isArray(dados) && Array.isArray(dados.ordemMarcas) && dados.ordemMarcas.length > 0) {
                ORDEM_MARCAS_SERVIDOR = dados.ordemMarcas;
                try { localStorage.setItem('ordemMarcasCache', JSON.stringify(ORDEM_MARCAS_SERVIDOR)); } catch (e) { /* ignora */ }
            }
            sincronizarMarcasVariaveis();
            atualizarVisualizacao();
            try { localStorage.setItem('baseDadosRotasCache', JSON.stringify(baseDadosRotas)); } catch (e) { /* quota cheia ou indisponível — ignora, não é crítico */ }
        } catch(e) {
            console.error("Erro ao ler nuvem: ", e);
            if (!silencioso) {
                alert("Não foi possível carregar os dados da nuvem. Verifica a ligação ou o URL do Apps Script.\n\n" + e.message);
            }
        }
        if (!silencioso) mostrarLoading(false);
    }

    async function enviarAlteracaoNuvem(id, marca, novoEstado) {

    // Aviso discreto (sem bloquear com alert) quando algo não sincronizou mesmo após as tentativas.
    function mostrarAvisoSync_() {
        let aviso = document.getElementById('avisoSyncFalhou');

    // Indicador pequeno e discreto (canto do ecrã) para sincronizações individuais
    // (um clique de estado). Não bloqueia o ecrã como a cortina de carregamento —

    let contadorSyncAtivos_ = 0;

            ind.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:#f5a623;display:inline-block;animation:pulsarSync 1s ease-in-out infinite;"></span> a sincronizar…';

    function carregarDadosDesdeExcel(event) {
        const ficheiro = event.target.files[0];
        if (!ficheiro) return;
        const leitor = new FileReader();
        leitor.onload = async function(e) {
            try {
                const livro = XLSX.read(e.target.result, { type: 'binary' });
                const folha = livro.Sheets[livro.SheetNames[0]];
                const linhas = XLSX.utils.sheet_to_json(folha);
                let idTemp = 1;
                let listaNovosDados = [];

                const linhaCabecalhos = XLSX.utils.sheet_to_json(folha, { header: 1 })[0] || [];
                const todasColunas = linhaCabecalhos.filter(c => c !== undefined && c !== null && String(c).trim() !== '').map(String);
                const colunasMarcasDetectadas = todasColunas.filter(c => {
                    const chave = c.trim().replace(/^\*+/, '').trim().toLowerCase();
                    return !CABECALHOS_RESERVADOS.has(chave) && !chave.endsWith('_yt');
                });
                if (colunasMarcasDetectadas.length > 0) {
                    // Segue exatamente a ordem do cabeçalho do Excel — nada de reordenar
                    // por lista fixa ou alfabeticamente. Se acrescentares uma coluna,
                    // entra nessa posição; se tirares uma, deixa de aparecer.
                    marcasLista = colunasMarcasDetectadas.map(c => c.trim().replace(/^\*+/, '').trim());
                    ORDEM_MARCAS_SERVIDOR = marcasLista.slice();
                    renderCabecalhoTabela();
                }

                linhas.forEach(linha => {
                    const obterValor = (chaves) => {
                        const k = Object.keys(linha).find(key => chaves.includes(key.trim().toLowerCase()));
                        return k ? linha[k] : null;
                    };
                    
                    let vEstadosStr = obterValor(['estadosjson', 'estados']);
                    let vHistoricoStr = obterValor(['historicojson', 'historico']);
                    
                    const normalizarComercial = (nome) => {
                        const mapa = { "Raphael Cortez": "Raphael Fernandes Cortez" };
                        return mapa[nome] || nome;
                    };

                    let idVal = parseInt(obterValor(['id'])) || idTemp++;
                    let clienteVal = String(obterValor(['cliente', 'pdv', 'estabelecimento']) || "PDV").trim();
                    let numeroVal = String(obterValor(['numero', 'número', 'nº', 'n.º', 'nº estabelecimento', 'numero estabelecimento', 'número do estabelecimento', 'codigo', 'código']) || '').trim();
                    let comercialVal = normalizarComercial(String(obterValor(['comercial', 'gestor']) || "Sem Gestor").trim());
                    let vendedorVal = String(obterValor(['vendedor', 'nome vendedor', 'nome do vendedor']) || '').trim();
                    let tipologiaVal = String(obterValor(['tipologia']) || '').trim();
                    let semanaValRaw = obterValor(['semana', 'semana do mês']);
                    let semanaVal = (semanaValRaw === null || semanaValRaw === undefined || String(semanaValRaw).trim() === '')
                        ? '' : String(semanaValRaw).trim().replace(/\.0$/, '');
                    let diaValRaw = obterValor(['dia', 'dia da semana', 'dia semana']);
                    let diaVal = (diaValRaw === null || diaValRaw === undefined || String(diaValRaw).trim() === '' || String(diaValRaw).trim() === '0')
                        ? '' : String(diaValRaw).trim();
                    
                    let estadosObj = {};
                    let historicoObj = {};
                    marcasLista.forEach(m => {
                        estadosObj[m] = "";
                        historicoObj[m] = { mes: false, ano: false, promo: false };
                    });

                    if (vEstadosStr) {
                        try {
                            estadosObj = typeof vEstadosStr === 'object' ? vEstadosStr : JSON.parse(vEstadosStr);
                        } catch(err) { console.error(err); }
                    }
                    
                    if (vHistoricoStr) {
                        try {
                            historicoObj = typeof vHistoricoStr === 'object' ? vHistoricoStr : JSON.parse(vHistoricoStr);
                        } catch(err) { console.error(err); }
                    }

                    if (!vEstadosStr && !vHistoricoStr) {
                        let diaNum = parseInt(diaVal);
                        if (!isNaN(diaNum)) {
                            let r = diaNum % 4;
                            semanaVal = r === 1 ? "1" : r === 2 ? "2" : r === 3 ? "3" : "4";
                            diaVal = "Segunda";
                        } else {
                            let textoDia = diaVal.toLowerCase();
                            if (textoDia.includes("seg")) diaVal = "Segunda";
                            else if (textoDia.includes("ter")) diaVal = "Terça";
                            else if (textoDia.includes("qua")) diaVal = "Quarta";
                            else if (textoDia.includes("qui")) diaVal = "Quinta";
                            else if (textoDia.includes("sex")) diaVal = "Sexta";
                        }
                        
                        historicoObj = {};
                        colunasMarcasDetectadas.forEach(colunaExcel => {
                            const colunaTrim = colunaExcel.trim();
                            const ehPromo = colunaTrim.startsWith('*');
                            const nomeExibido = colunaTrim.replace(/^\*+/, '').trim();
                            const chaveComAsterisco = colunaTrim.toLowerCase();
                            const chaveSemAsterisco = nomeExibido.toLowerCase();
                            historicoObj[nomeExibido] = {
                                mes: !!obterValor([chaveComAsterisco, chaveSemAsterisco]),
                                ano: !!obterValor([chaveComAsterisco + '_yt', chaveSemAsterisco + '_yt']),
                                promo: ehPromo
                            };
                        });
                    }

                    const chaveAtual = `${clienteVal}||${comercialVal}||${diaVal}||${semanaVal}`;
                    const registoAnterior = baseDadosRotas.find(r =>
                        `${r.cliente}||${r.comercial}||${r.dia}||${r.semana}` === chaveAtual);
                    if (registoAnterior && registoAnterior.estados) {
                        // Só traz o estado antigo de marcas que AINDA existem no Excel
                        // atual — caso contrário, marcas removidas do cabeçalho (ex.:
                        // "Sol&Mar") voltavam sempre a aparecer como fantasmas.
                        const estadosAntigosValidos = {};
                        Object.keys(registoAnterior.estados).forEach(marcaAntiga => {
                            const aindaExisteNoExcel = colunasMarcasDetectadas.some(c =>
                                c.trim().replace(/^\*+/, '').trim().toLowerCase() === marcaAntiga.trim().toLowerCase());
                            if (aindaExisteNoExcel) estadosAntigosValidos[marcaAntiga] = registoAnterior.estados[marcaAntiga];
                        });
                        estadosObj = Object.assign({}, estadosObj, estadosAntigosValidos);
                    }

                    listaNovosDados.push({
                        id: idVal,
                        cliente: clienteVal,
                        numero: numeroVal,
                        comercial: comercialVal,
                        vendedor: vendedorVal,
                        tipologia: tipologiaVal,
                        dia: diaVal,
                        semana: semanaVal,
                        estados: estadosObj,
                        historico: historicoObj
                    });
                });

                if (colunasMarcasDetectadas.length === 0) {
                    const setMarcasDados = new Set();
                    listaNovosDados.forEach(r => {
                        Object.keys(r.estados || {}).forEach(m => setMarcasDados.add(m));
                        Object.keys(r.historico || {}).forEach(m => setMarcasDados.add(m));
                    });
                    if (setMarcasDados.size > 0) {
                        marcasLista = Array.from(setMarcasDados).sort((a, b) => {
                            const idxA = ordemMarcasFixa.findIndex(m => m.toLowerCase() === a.toLowerCase());
                            const idxB = ordemMarcasFixa.findIndex(m => m.toLowerCase() === b.toLowerCase());
                            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                            if (idxA !== -1) return -1;
                            if (idxB !== -1) return 1;
                            return a.localeCompare(b);
                        });
                        renderCabecalhoTabela();
                    }
                }

                mostrarLoading(true);
                const respostaImport = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "limpar_e_importar", rows: listaNovosDados })
                });
                if (!respostaImport.ok) throw new Error('HTTP ' + respostaImport.status);
                const resultadoImport = await respostaImport.json();
                if (!resultadoImport || resultadoImport.ok !== true) {
                    throw new Error((resultadoImport && resultadoImport.erro) || 'resposta inesperada do Apps Script');
                }
                // Guarda a ordem das colunas (tal como veio do Excel) no servidor, para
                // que todos os GC vejam sempre a mesma ordem em vez de recalculada
                // localmente e de forma diferente em cada dispositivo.
                if (ORDEM_MARCAS_SERVIDOR && ORDEM_MARCAS_SERVIDOR.length > 0) {
                    postComRetry_({ action: 'guardar_config', chave: 'ordemMarcas', valor: ORDEM_MARCAS_SERVIDOR })
                        .then(r => { if (!r || r.ok === false) console.error('Falha ao guardar ordem das marcas no servidor'); });
                }
                alert("Roteiro enviado para o Google Sheets com sucesso! (" + resultadoImport.importados + " registos)");
                mostrarResumoClientesPorGestor_(listaNovosDados);
                await puxarDadosDaNuvem();
            } catch (erro) {
                alert("Erro ao importar para o Google Sheets: " + erro.message);
                console.error(erro);
            }
        };
        leitor.readAsBinaryString(ficheiro);
    }

    function alternarEstado(idRegisto, marca) {
        const registo = baseDadosRotas.find(item => item.id === idRegisto);
        if (registo) {
            // Usa SEMPRE a semana do próprio registo (registo.semana), nunca o valor
            // do dropdown "Semana". Em modo de pesquisa a tabela mostra clientes de
            // qualquer semana (o filtro de pesquisa ignora a semana selecionada), pelo
            // que usar o dropdown aqui aplicava o ciclo de estados errado (com ou sem
            // "FOCO SEMANAL") a clientes de semanas diferentes da selecionada.
            const marcaFocoSemana = MARCA_FOCO_POR_SEMANA[registo.semana];
            const ehMarcaFoco = marca.trim().toLowerCase() === (marcaFocoSemana || "").trim().toLowerCase();
            
            const ciclo = ehMarcaFoco 
                ? ["", "FOCOSEMANAL", "NAO OK", "OK", "NEGOCIADO"] 
                : ["", "FOCO", "NAO OK", "OK", "NEGOCIADO"];

            const atual = registo.estados[marca] || "";
            let idxAtual = ciclo.indexOf(atual);
            if (idxAtual === -1) idxAtual = 0;

            const proximo = ciclo[(idxAtual + 1) % ciclo.length];
            registo.estados[marca] = proximo;
            marcarAlteracaoPendente_('estado', idRegisto, marca, proximo);
            atualizarVisualizacao();
            enviarAlteracaoNuvem(idRegisto, marca, proximo);
        }
    }

    function obterInnerHtmlBotao(est) {
        if (est === "FOCO") return `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-4z"/></svg> FOCO`;
        if (est === "FOCOSEMANAL") return `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-4z"/></svg> FOCO SEMANAL`;
        if (est === "NAO OK") return `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 12z"/></svg> NÃO OK`;
        if (est === "OK") return `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> OK`;
        if (est === "NEGOCIADO") return `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 3v2H4v14h16V5h-5V3H9zm2 4h2v2h-2V7zm-4 4h8v2H7v-2zm0 4h8v2H7v-2z"/></svg> NEGOCIADO`;
        return `VAZIO`;
    }

    /**
     * Reconstrói as opções do dropdown "Vendedor" com os vendedores únicos
     * encontrados nos registos do Gestor atualmente selecionado. Chamada sempre
     * que o Gestor muda e sempre que chegam novos dados (import Excel / sync).
     * Se o vendedor previamente selecionado deixar de existir na lista, o
     * filtro volta a "Todos" em vez de ficar preso a um valor inválido.
     */
    function popularFiltroVendedor_() {
        const selectVendedor = document.getElementById('vendedorSelect');
        if (!selectVendedor) return;
        const com = document.getElementById('comercialSelect').value;
        const valorAnterior = selectVendedor.value;

        const vendedores = Array.from(new Set(
            baseDadosRotas
                .filter(i => i.comercial === com && i.vendedor && String(i.vendedor).trim() !== '')
                .map(i => String(i.vendedor).trim())
        )).sort((a, b) => a.localeCompare(b));

        selectVendedor.innerHTML = `<option value="">Todos</option>` +
            vendedores.map(v => `<option value="${v}">${v}</option>`).join('');

        selectVendedor.value = vendedores.includes(valorAnterior) ? valorAnterior : '';
    }

        const sem = document.getElementById('semanaSelect').value;
        popularFiltroVendedor_();
        const vendedorSelect = document.getElementById('vendedorSelect');
        const vend = vendedorSelect ? vendedorSelect.value : '';
        
        localStorage.setItem('gestorSelecionado', com);
        localStorage.setItem('semanaSelecionada', sem);

        const corpo = document.getElementById('tabelaVisitas');
        if (!corpo) return;
        corpo.innerHTML = '';

        const termoPesquisa = document.getElementById('pesquisaCliente').value.trim().toLowerCase();
        const emModoPesquisa = termoPesquisa.length > 0;
        const diasTabs = document.getElementById('diasTabs');
        if (diasTabs) diasTabs.style.display = emModoPesquisa ? 'none' : '';

        const passaVendedor = i => !vend || String(i.vendedor || '').trim() === vend;

        const filtrados = emModoPesquisa
            ? baseDadosRotas.filter(i => i.comercial === com && passaVendedor(i) && (
                (i.cliente || '').toLowerCase().includes(termoPesquisa) ||
                String(i.numero || '').toLowerCase().includes(termoPesquisa)
              ))
            : baseDadosRotas.filter(i => i.comercial === com && i.semana === sem && i.dia === diaAtualSelecionado && passaVendedor(i));

        renderResumoFoco(com, sem);
        if(filtrados.length === 0) {
            const mensagem = emModoPesquisa ? `Sem estabelecimentos para "${termoPesquisa}" neste gestor.` : 'Sem rota agendada.';
            corpo.innerHTML = `<tr><td colspan="${1 + marcasLista.length}" style="text-align:center;padding:30px;">${mensagem}</td></tr>`;
            return;
        }

        filtrados.forEach(item => {
            const tr = document.createElement('tr');
            const numeroMeta = item.numero ? `<span class="cliente-meta">Nº ${item.numero}</span>` : '';
            const diaMeta = emModoPesquisa ? `<span class="cliente-meta">${item.dia || 'sem dia'} · Semana ${item.semana || '—'}</span>` : '';
            
            const temNegociado = Object.values(item.estados || {}).includes("NEGOCIADO");

                <div>
                    <button class="btn-cart" onclick="abrirModalEncomenda(${item.id})">
                        <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        Encomendar
                    </button>
                </div>` : '';

            let html = `<td>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div>${item.cliente}${numeroMeta}${diaMeta}</div>
                    ${botaoEncomendarHtml}
                </div>
            </td>`;
            
            const tipologiaNorm = String(item.tipologia || '').trim().toLowerCase();
            const ehBar = tipologiaNorm === 'bar';

            marcasLista.forEach(m => {
                // Colunas "0.0%" e "Preta" são mutuamente exclusivas consoante a
                // Tipologia do cliente: Bar -> só Preta; qualquer outra -> só 0.0%.
                // Quando não há Tipologia definida, mostra ambas normalmente.
                if (tipologiaNorm) {
                    if (ehColunaZeroZero_(m) && ehBar) { html += `<td data-label="${m}"></td>`; return; }
                    if (ehColunaPreta_(m) && !ehBar) { html += `<td data-label="${m}"></td>`; return; }

                const est = item.estados[m] || "";
                const hist = item.historico[m] || { mes: false, ano: false, promo: false };
                const ehPromoMensal = !!hist.promo;

                let badgeColocouHtml = '';
                if (est === "NEGOCIADO") {
                    const estaColocou = !!(item.colocou && item.colocou[m]);
                    badgeColocouHtml = `<span class="badge-colocou ${estaColocou ? 'sim' : 'nao'}">${estaColocou ? '✓ Colocou' : 'Não colocou'}</span>`;

                    <td data-label="${m}">

                                    : `<svg class="${hist.mes?'':'icon-disabled'}" viewBox="0 0 24 24" style="width:14px;fill:#008200;"><circle cx="12" cy="12" r="10"/></svg>
                                       <svg class="${hist.ano?'':'icon-disabled'}" viewBox="0 0 24 24" style="width:14px;fill:#008200;"><path d="M5 2h3v1.5h11L17 9l2 5.5H8V22H5V2z"/></svg>`
                                }
                            </div>
                            <button class="btn-estado ${est.toLowerCase().replace(' ', '-') || 'vazio'}" onclick="alternarEstado(${item.id}, '${m}')">${obterInnerHtmlBotao(est)}</button>
                            ${badgeColocouHtml}
                        </div>
                    </td>`;
            });
            tr.innerHTML = html;
            corpo.appendChild(tr);
        });
    }

    function renderResumoFoco(com, sem) {
        const el = document.getElementById('resumoFoco');
        if (!el) return;

        const registos = baseDadosRotas.filter(i => i.comercial === com && i.semana === sem);

        const colunas = marcasLista.map(m => {
            const foco = registos.filter(r => (r.estados && r.estados[m]) === 'FOCO' || (r.estados && r.estados[m]) === 'FOCOSEMANAL').length;
            const atingido = registos.filter(r => {
                const est = r.estados && r.estados[m];
                if (est === 'OK') return true;
                if (est === 'NEGOCIADO' && r.colocou && r.colocou[m]) return true;
                return false;
            }).length;
            return `
                <div class="resumo-col">
                    <div class="resumo-marca">${m}</div>
                    <div class="resumo-pill foco">${foco}</div>
                    <div class="resumo-pill atingido">${atingido}</div>
                </div>`;
        }).join('');

        el.innerHTML = `
            <div class="resumo-card">
                <div class="resumo-titulo">Resumo · <span>${com || 'sem gestor'}</span></div>
                <div class="resumo-grid">${colunas}</div>
                <div class="resumo-legenda">
                    <span><span class="dot foco"></span>Foco</span>
                    <span><span class="dot atingido"></span>Atingido</span>
                </div>
            </div>`;
    }

    async function limparFocoGestor() {
        const com = document.getElementById('comercialSelect').value;
        const semanaSelect = document.getElementById('semanaSelect');
        const sem = semanaSelect.value;
        const semanaLabel = semanaSelect.selectedOptions[0].textContent.replace(' 📍 (atual)', '');

        const registos = baseDadosRotas.filter(i => i.comercial === com && i.semana === sem);
        if (registos.length === 0) {
            alert('Não há clientes para "' + com + '" nesta semana.');
            return;
        }

        // Lista apenas os pares (id, marca) que têm efetivamente um estado marcado.
        const marcasParaLimpar = [];
        registos.forEach(r => {
            Object.keys(r.estados || {}).forEach(m => {
                if (r.estados[m]) marcasParaLimpar.push({ id: r.id, marca: m });
            });
        });

        if (marcasParaLimpar.length === 0) {
            alert('Não há marcações para limpar em "' + com + '" — ' + semanaLabel + '.');
            return;
        }

        if (!confirm(`Limpar todos os focos (FOCO / NÃO OK / OK / NEGOCIADO / FOCO SEMANAL) de "${com}" — ${semanaLabel}, em todos os dias?\n\nIsto vai apagar ${marcasParaLimpar.length} marcações e não pode ser desfeito.`)) return;

        mostrarLoading(true);

        // Atualização local imediata (feedback visual).
        registos.forEach(r => { r.estados = {}; });
        atualizarVisualizacao();

        // IMPORTANTE: em vez de reenviar baseDadosRotas inteira via "limpar_e_importar"
        // (o que reescrevia TODA a folha, incluindo registos de outros gestores/GCs que
        // este browser podia não ter atualizados nos últimos segundos — risco real de
        // apagar alterações concorrentes feitas por outra pessoa entretanto), envia-se
        // agora um pedido "atualizar_estado" por cada (id, marca) afetado, usando a
        // mesma ação já usada em enviarAlteracaoNuvem(). Mais pedidos, mas seguro.
        try {
            let falhas = 0;
            for (const { id, marca } of marcasParaLimpar) {
                const resultado = await postComRetry_({ action: "atualizar_estado", id: id, marca: marca, novoEstado: "" });
                if (!resultado || resultado.ok === false) falhas++;
            }
            if (falhas > 0) mostrarAvisoSync_();
            await puxarDadosDaNuvem(true);
        } catch (e) {
            console.error(e);
            alert('Erro ao limpar na nuvem: ' + e.message);
        }
        mostrarLoading(false);
    }

    const DIAS_ORDEM = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];

    function rotuloEstado(est) {
        if (est === 'FOCO') return 'foco';
        if (est === 'FOCOSEMANAL') return 'foco semanal';
        if (est === 'NAO OK') return 'não ok';
        if (est === 'OK') return 'ok';
        if (est === 'NEGOCIADO') return 'negociado';
        return '';
    }

    function obterPrimeiroEUltimoNome(nomeCompleto) {
        if (!nomeCompleto) return "gestor";
        const partes = nomeCompleto.trim().split(/\s+/);
        if (partes.length === 1) return partes[0].toLowerCase();
        return `${partes[0]} ${partes[partes.length - 1]}`.toLowerCase();
    }

    function construirRoteiroSemanalPDF() {
        if (!window.jspdf) {
            alert('A biblioteca de geração de PDF ainda não carregou. Verifica a ligação à internet e tenta novamente.');
            return null;
        }
        const com = document.getElementById('comercialSelect').value;
        const semanaSelect = document.getElementById('semanaSelect');
        const sem = semanaSelect.value;
        const semanaLabel = semanaSelect.selectedOptions[0].textContent.replace(' 📍 (atual)', '');

        const registos = baseDadosRotas.filter(i => i.comercial === com && i.semana === sem);
        if (registos.length === 0) {
            alert('Não há clientes para "' + com + '" nesta semana.');
            return null;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'pt', format: 'a4' });
        const margem = 40;
        let y = margem;

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.text('Roteiro Semanal — ' + com, margem, y);
        y += 18;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(120);
        doc.text(semanaLabel + ' · Gerado em ' + new Date().toLocaleDateString('pt-PT'), margem, y);
        doc.setTextColor(0);
        y += 16;

        const estiloTabela = {
            theme: 'grid',
            styles: { fontSize: 8, halign: 'center', lineColor: [0, 0, 0], lineWidth: 0.5, textColor: [0, 0, 0] },
            headStyles: { fillColor: [255, 255, 255], textColor: [0, 0, 0], fontStyle: 'bold' },
            margin: { left: margem, right: margem }
        };

        const larguraPaginaUtil = 595.28 - (margem * 2);
        const larguraNome = 180;
        const larguraMarca = (larguraPaginaUtil - larguraNome) / marcasLista.length;
        const columnStylesDia = { 0: { halign: 'center', cellWidth: larguraNome } };
        marcasLista.forEach((_, idx) => { columnStylesDia[idx + 1] = { cellWidth: larguraMarca }; });

        doc.autoTable(Object.assign({}, estiloTabela, {
            startY: y,
            head: [['', ...marcasLista]],
            body: [
                ['Total Foco', ...marcasLista.map(m => String(registos.filter(r => (r.estados && (r.estados[m] === 'FOCO' || r.estados[m] === 'FOCOSEMANAL')).length)))],
                ['Total Atingido', ...marcasLista.map(m => String(registos.filter(r => (r.estados && r.estados[m]) === 'OK').length))]
            ],
            columnStyles: columnStylesDia
        }));
        y = doc.lastAutoTable.finalY + 20;

        const desenharTabelaDia = (titulo, lista) => {
            if (y > 740) { doc.addPage(); y = margem; }
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.text(titulo, margem, y);
            y += 8;
            doc.autoTable(Object.assign({}, estiloTabela, {
                startY: y,
                head: [['Estabelecimento', ...marcasLista]],
                body: lista.map(item => [item.cliente, ...marcasLista.map(m => rotuloEstado((item.estados && item.estados[m]) || ''))]),
                columnStyles: columnStylesDia
            }));
            y = doc.lastAutoTable.finalY + 20;
        };

        DIAS_ORDEM.forEach(dia => {
            const doDia = registos.filter(r => r.dia === dia);
            if (doDia.length > 0) desenharTabelaDia(`${dia}-feira (${doDia.length} clientes)`, doDia);
        });

        const semDia = registos.filter(r => !DIAS_ORDEM.includes(r.dia));
        if (semDia.length > 0) desenharTabelaDia(`Sem dia definido (${semDia.length} clientes)`, semDia);

        const nomeGestorResumido = obterPrimeiroEUltimoNome(com);
        const numeroSemanaAno = obterSemanaISO(new Date());
        
        const nomeFicheiro = `${nomeGestorResumido} semana ${numeroSemanaAno}.pdf`;

        return { doc, nomeFicheiro, com, semanaLabel };
    }

    function gravarRoteiroSemanalPDF() {
        const resultado = construirRoteiroSemanalPDF();
        if (!resultado) return;
        resultado.doc.save(resultado.nomeFicheiro);
    }

    // --- LÓGICA DO MODAL DE ENCOMENDAS ---
    function abrirModalEncomenda(id) {
        clienteAtualEncomenda = baseDadosRotas.find(c => c.id === id);
        if (!clienteAtualEncomenda) return;

        quantidadesEncomenda = {};
        document.getElementById("modalClientName").innerText = `Encomenda: ${clienteAtualEncomenda.cliente}`;
        
        const gamasNegociadas = Object.keys(clienteAtualEncomenda.estados || {})
            .filter(m => clienteAtualEncomenda.estados[m] === "NEGOCIADO")
            .map(m => m.toLowerCase());
        
        renderizarCatalogo(gamasNegociadas);
        atualizarTotalEncomenda();
        
        document.getElementById("orderModal").style.display = "flex";
