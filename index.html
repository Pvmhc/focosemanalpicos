    function fecharModalEncomenda() {
        document.getElementById("orderModal").style.display = "none";
        clienteAtualEncomenda = null;
    }

    function renderizarCatalogo(gamasNegociadas) {
        const container = document.getElementById("modalCatalogBody");
        container.innerHTML = "";

        const agrupadosPorGama = PRODUCT_CATALOG.reduce((acc, product) => {
            if (!acc[product.range]) acc[product.range] = [];
            acc[product.range].push(product);
            return acc;
        }, {});

        let encontrouAlguma = false;

        for (const [nomeGama, produtos] of Object.entries(agrupadosPorGama)) {
            const estaNegociada = gamasNegociadas.includes(nomeGama.toLowerCase());
            if (!estaNegociada) continue;

            encontrouAlguma = true;
            const rangeBlock = document.createElement("div");
            rangeBlock.className = "range-section";
            
            const badge = `<span class="badge-negociado-modal">NEGOCIADO</span>`;
            
            let html = `<h3 class="range-title">${nomeGama} ${badge}</h3>`;
            
            produtos.forEach(prod => {
                html += `
                    <div class="product-row">
                        <div class="product-info">
                            <div class="product-thumbnail-container">
                                <svg class="product-svg-thumb" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2a2 2 0 0 1-2 2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2a2 2 0 0 1-2-2V2z"/></svg>
                            </div>
                            <span class="product-name">${prod.name}</span>
                        </div>
                        <div class="qty-counter">
                            <button class="btn-qty" onclick="ajustarQtd('${prod.id}', -1)">-</button>
                            <input type="number" id="qty-${prod.id}" class="input-qty" value="0" min="0" onchange="definirQtd('${prod.id}', this.value)">
                            <button class="btn-qty" onclick="ajustarQtd('${prod.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            });
            
            rangeBlock.innerHTML = html;
            container.appendChild(rangeBlock);
        }

        if (!encontrouAlguma) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--muted);">Nenhuma gama negociada encontrada para este cliente.</div>`;
        }
    }

    function ajustarQtd(productId, change) {
        const input = document.getElementById(`qty-${productId}`);
        let currentVal = parseInt(input.value, 10) || 0;
        currentVal = Math.max(0, currentVal + change);
        input.value = currentVal;
        definirQtd(productId, currentVal);
    }

    function definirQtd(productId, val) {
        const qty = Math.max(0, parseInt(val, 10) || 0);
        if (qty > 0) {
            quantidadesEncomenda[productId] = qty;
        } else {
            delete quantidadesEncomenda[productId];
        }
        atualizarTotalEncomenda();
    }

    function atualizarTotalEncomenda() {
        const total = Object.values(quantidadesEncomenda).reduce((acc, count) => acc + count, 0);
        document.getElementById("totalItemCount").innerText = total;
    }

    // --- AUTOMAÇÃO: MARCAR "NEGOCIADO" COMO "Colocou" AO ENVIAR ENCOMENDA ---
    function processarColocacaoAutomatica() {
        if (!clienteAtualEncomenda || !clienteAtualEncomenda.estados) return;
        if (!clienteAtualEncomenda.colocou) clienteAtualEncomenda.colocou = {};

        let houveAlteracao = false;
        Object.keys(clienteAtualEncomenda.estados).forEach(marca => {
            if (clienteAtualEncomenda.estados[marca] === "NEGOCIADO") {
                clienteAtualEncomenda.colocou[marca] = true;
                marcarAlteracaoPendente_('colocou', clienteAtualEncomenda.id, marca, true);
                enviarColocouNuvem(clienteAtualEncomenda.id, marca, true);
                houveAlteracao = true;
            }
        });

        if (houveAlteracao) {
            atualizarVisualizacao();
        }
    }

    function gerarEmailEncomenda() {
        if (Object.keys(quantidadesEncomenda).length === 0) {
            alert("Por favor, seleciona pelo menos um produto para encomendar.");
            return;
        }

        // Executa a marcação automática para "Colocou"
        processarColocacaoAutomatica();

        const emailDestination = "apoioaocliente@novadis.pt";
        const numeroCliente = clienteAtualEncomenda.numero ? ` (Nº ${clienteAtualEncomenda.numero})` : '';
        const subject = `Novo Pedido Comercial: ${clienteAtualEncomenda.cliente}${numeroCliente}`;

        let bodyLines = [
            `Pedido de Encomenda`,
            `Cliente: ${clienteAtualEncomenda.cliente}`,
            `Nº Estabelecimento: ${clienteAtualEncomenda.numero || 'N/A'}`,
            ``,
            `PRODUTO                                     | QUANTIDADE`,
            `------------------------------------------------------`
        ];

        PRODUCT_CATALOG.forEach(prod => {
            if (quantidadesEncomenda[prod.id]) {
                const namePadded = prod.name.padEnd(43, ' ');
                bodyLines.push(`${namePadded} : ${quantidadesEncomenda[prod.id]} un.`);
            }
        });

        bodyLines.push(`------------------------------------------------------`);
        bodyLines.push(`Total de Caixas/Packs Solicitados: ${document.getElementById("totalItemCount").innerText}`);
        bodyLines.push(``);
        bodyLines.push(`Por favor, confirmar receção e agendamento da entrega.`);

        const mailtoUrl = `mailto:${emailDestination}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyLines.join("\n"))}`;
        window.location.href = mailtoUrl;

        fecharModalEncomenda();
    }

    function gerarWhatsappEncomenda() {
        if (Object.keys(quantidadesEncomenda).length === 0) {
            alert("Por favor, seleciona pelo menos um produto para encomendar.");
            return;
        }

        // Executa a marcação automática para "Colocou"
        processarColocacaoAutomatica();

        const numeroCliente = clienteAtualEncomenda.numero ? ` (Nº ${clienteAtualEncomenda.numero})` : '';

        let bodyLines = [
            `*Pedido de Encomenda*`,
            `*Cliente:* ${clienteAtualEncomenda.cliente}${numeroCliente}`,
            ``,
            `*Produtos solicitados:*`
        ];

        PRODUCT_CATALOG.forEach(prod => {
            if (quantidadesEncomenda[prod.id]) {
                bodyLines.push(`• ${prod.name}: *${quantidadesEncomenda[prod.id]} un.*`);
            }
        });

        bodyLines.push(``);
        bodyLines.push(`*Total de Caixas/Packs:* ${document.getElementById("totalItemCount").innerText}`);
        bodyLines.push(`Por favor, confirmar receção e agendamento da entrega.`);

        const text = bodyLines.join("\n");
        const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        window.open(whatsappUrl, '_blank');

        fecharModalEncomenda();
    }

    // --- INICIALIZAÇÃO COM LOCALSTORAGE ---
    const gestorSalvo = localStorage.getItem('gestorSelecionado');
    if (gestorSalvo) {
        document.getElementById('comercialSelect').value = gestorSalvo;
    }

    const semanaSalva = localStorage.getItem('semanaSelecionada');
    if (semanaSalva) {
        const selectSemana = document.getElementById('semanaSelect');
        selectSemana.value = semanaSalva;
        const semanaISO = obterSemanaISO(new Date());
        const semanaCiclo = calcularSemanaCiclo(semanaISO);
        Array.from(selectSemana.options).forEach(opt => {
            const rotulo = 'Semana ' + opt.value;
            opt.textContent = (opt.value === String(semanaCiclo)) ? rotulo + ' 📍 (atual)' : rotulo;
        });
    } else {
        aplicarSemanaAtual();
    }

    // Mostra imediatamente os últimos dados conhecidos (cache local) enquanto
    // o pedido real à nuvem ainda vai a caminho — evita o ecrã de "a carregar"
    // demorado sempre que o Apps Script demora a responder (arranque a frio,
    // muitos GCs em simultâneo, etc.). Os dados são substituídos assim que a
    // resposta da nuvem chegar.
    try {
        const cache = localStorage.getItem('baseDadosRotasCache');
        if (cache) {
            baseDadosRotas = JSON.parse(cache);
            atualizarVisualizacao();
        }
    } catch (e) { /* cache inválida — ignora e segue para o fetch normal */ }

    puxarDadosDaNuvem(!!localStorage.getItem('baseDadosRotasCache'));

    const INTERVALO_AUTO_SYNC_MS = 15 * 1000;
    setInterval(() => {
        if (document.visibilityState === 'visible') {
            puxarDadosDaNuvem(true);
        }
    }, INTERVALO_AUTO_SYNC_MS);

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            puxarDadosDaNuvem(true);
        }
    });
</script>
</body>
</html>
